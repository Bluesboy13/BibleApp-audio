name: Greek chapter check

# Transcribes the Greek test chapter verse by verse to compare what was said with the text.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/greek-check.yml
      - tools/check_greek.py

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            samples/greek-test
      - uses: actions/checkout@v4
        with:
          repository: Bluesboy13/BibleApp
          ref: claude/sweet-cerf-nr0tgl
          path: app
          sparse-checkout: |
            data
            tools/greek
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper numpy torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python tools/check_greek.py 43 1 samples/greek-test/43/001
